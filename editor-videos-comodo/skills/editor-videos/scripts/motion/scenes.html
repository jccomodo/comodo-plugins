  const tool=g();el('rect',{x:-100,y:-62,width:200,height:124,rx:28,fill:WH,stroke:OR,'stroke-width':5},tool);
  el('path',{d:'M-34 20 L34 20 M0 20 L0 -26 M-34 -8 L34 -26 M-34 -8 L-48 14 L-20 14 Z M34 -26 L20 -4 L48 -4 Z',fill:'none',stroke:OR,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'},tool);

  const c1=card(root,q=>{el('circle',{cx:0,cy:-16,r:24,fill:OR},q);T('?',0,-6,34,WH,'eb','middle',q)},'Poucas','perguntas');

  const c3=card(root,q=>{[[-26,22],[0,38],[26,12]].forEach(([x,h],i)=>{el('rect',{x:x-9,y:20-h*1.1,width:18,height:h*1.1,rx:4,fill:i==1?OR:'#CFCFCF'},q)})},'Lado a lado','com a média');
  const A1=mkArrow(268,170,332,170),A2=mkArrow(568,170,632,170);
  return()=>{setT(c1,xs[0],170,P_(0,0,.4));op(c1,F_(0,0,.1));setArrow(A1,E_(1,-.5,.4));
    setT(c2,xs[1],170,P_(1,0,.4));op(c2,F_(1,0,.1));setArrow(A2,E_(2,-.4,.4));
    setT(c3,xs[2],170,P_(2,0,.4));op(c3,F_(2,0,.1))}};

let upd=null;
window.setScene=(n,cues,dur)=>{C=cues;D=dur;upd=scenes[n]()};

<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#s{position:relative;width:760px;height:260px;overflow:hidden}
.c{position:absolute;left:60px;top:50px;width:640px;border-radius:0}#cur{position:absolute;left:0;top:0;width:72px;height:72px;transform-origin:8px 5px}#rg{position:absolute;width:30px;height:30px;border-radius:50%;border:5px solid #FF3B1E;opacity:0}</style>
<div id="s"><img class="c" id="a" src="card_seguir.png"><img class="c" id="b" src="card_seguindo.png" style="opacity:0">
<div id="rg"></div>
<svg id="cur" viewBox="0 0 44 44"><path d="M5 3 L5 33 L13 26 L19 40 L25 37 L19 24 L30 24 Z" fill="#0A0A0A" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=t=>1-Math.pow(1-t,3),io=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const BX=60+1090*640/1260, BY=50+80*640/1260;   // centro do botão
window.render=t=>{
 const k=eo(cl(t/.4)), out=cl((t-3.15)/.4);
 const op=cl(t/.25)*(1-out), y=(1-k)*28+out*14;
 for(const id of ['a','b']){const e=document.getElementById(id);e.style.transform=`translateY(${y}px) scale(${.94+.06*k})`}
 const sw=cl((t-1.5)/.22);
 document.getElementById('a').style.opacity=op*(1-sw);document.getElementById('b').style.opacity=op*sw;
 // cursor: entra de baixo à direita, chega ao botão em 1.35 s, clica, sai
 let cx,cy;const p=io(cl((t-.35)/1.0));
 cx=lerp(700,BX+6,p);cy=lerp(250,BY+6,p);
 if(t>2.2){const q=io(cl((t-2.2)/.6));cx=lerp(BX+6,720,q);cy=lerp(BY+6,270,q)}
 const click=t>1.3&&t<1.5?(1-Math.abs((t-1.4)/.1))*.18:0;
 const cur=document.getElementById('cur');cur.style.transform=`translate(${cx}px,${cy}px) scale(${1-click})`;
 cur.style.opacity=cl((t-.3)/.15)*(1-cl((t-2.7)/.2));
 const r=cl((t-1.4)/.45);const rg=document.getElementById('rg');rg.style.left=(BX-15-r*22)+'px';rg.style.top=(BY-15-r*22)+'px';rg.style.width=(30+r*44)+'px';rg.style.height=(30+r*44)+'px';rg.style.opacity=t>1.4?(1-r)*.9:0};
function lerp(a,b,t){return a+(b-a)*t}
window.READY=1;
</script>

<!doctype html><meta charset="utf-8">
<!-- MÉTODO C (tela dividida) — EXEMPLO APROVADO: cena 1 do vídeo 'Atendimento que não perde venda'.
 Para um vídeo novo: copie como overlay.html na pasta do vídeo, mantenha o motor (P/g/mk/pop), a pílula e os ícones,
 e reescreva só o bloco entre 'S1–S4' e o fim de window.render com as cenas da fala nova. -->
<style>
@font-face{font-family:P;font-weight:600;src:url(assets/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
html,body{margin:0;background:transparent}
#p{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P}
#top{position:absolute;left:0;top:0;width:1080px;height:960px;background:#F4F4F6 url(assets/fundo_grade.png) 0 0/1080px 960px}
#svg{position:absolute;left:0;top:0}
#pill{position:absolute;left:0;top:0;height:98px;border-radius:49px;background:#FF3B1E;color:#fff;font-weight:600;font-size:64px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;box-shadow:0 14px 34px rgba(150,30,10,.30),inset 0 1px 0 rgba(255,255,255,.28)}
#pill .w{position:absolute;top:0;line-height:98px;display:inline-block}
</style>
<div id="p"><div id="top"><svg id="svg" width="1080" height="960" viewBox="0 0 1080 960"></svg></div><div id="pill"></div></div>
<script src="chunks.js"></script>
<script>
const LAYER=(location.search.match(/layer=(\w+)/)||[])[1]||'top';
const OR='#FF3B1E',DK='#1D1D1F',GR='#8E8E93',LG='#C7C7CC',BL='#34B7F1',GRN='#2BB24C';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
document.getElementById('top').style.display=LAYER==='top'?'block':'none';
document.getElementById('pill').style.display=LAYER==='pill'?'block':'none';
/* molas pré-simuladas (interrompíveis, determinísticas) */
const T0=0,T1=(window.DUR||30)+.5,SR=480,N=Math.ceil((T1-T0)*SR)+3,S={};
function P(name,init,evs){evs=evs.slice().sort((a,b)=>a[0]-b[0]);const out=new Float32Array(N);let x=init,v=0,tg=init,resp=.4,d=1,ei=0;
 for(let i=0;i<N;i++){const t=T0+i/SR;while(ei<evs.length&&evs[ei][0]<=t){tg=evs[ei][1];if(evs[ei][2]!=null)resp=evs[ei][2];if(evs[ei][3]!=null)d=evs[ei][3];ei++}
  const w=2*Math.PI/resp;const a=-2*d*w*v-w*w*(x-tg);v+=a/SR;x+=v/SR;out[i]=x}S[name]=out}
function g(name,t){const f=(t-T0)*SR,i=Math.floor(f),a=S[name];if(i<=0)return a[0];if(i>=N-1)return a[N-1];const u=f-i;return a[i]*(1-u)+a[i+1]*u}
const NS='http://www.w3.org/2000/svg';
function mk(par,tag,at,st){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(st)Object.assign(e.style,st);par.appendChild(e);return e}
const svg=document.getElementById('svg'),grp=p=>mk(p,'g',{});
const MC=document.createElement('canvas').getContext('2d');
function tw(s,font){MC.font=font;return MC.measureText(s).width}
const TXT=(par,s,x,y,size,w,fill)=>{const e=mk(par,'text',{x,y,'text-anchor':'middle','font-family':'P','font-weight':w||600,'font-size':size,fill:fill||'#6E6E73'});e.textContent=s;return e};
function dash(p,v){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-cl(v))}

function init(){
/* ---------- pílula (legenda na emenda) ---------- */
const FONTP='600 64px P',PAD=44;
const wof=txt=>Math.ceil(tw(txt,FONTP))+PAD*2;
const evW=[],evP=[];
CHUNKS.forEach((c,i)=>{let pre='';c.words.forEach((w,k)=>{pre+=(k?' ':'')+w.w;evW.push([(k==0?c.t0:w.t)-.04,wof(pre),.18,.9])});
 evP.push([c.t0,1,.24,.9]);const nx=CHUNKS[i+1];if(!(nx&&nx.t0-c.t1<.35))evP.push([c.t1,0,.2,1])});
P('pw',200,evW);P('pp',0,evP);
const pill=document.getElementById('pill');
function renderPill(t){
 const pp=cl(g('pp',t),0,1.02);
 let ci=-1;CHUNKS.forEach((c,i)=>{if(t>=c.t0)ci=i});
 pill.style.display=(pp<.01||ci<0)?'none':'block';if(pp<.01||ci<0)return;
 const c=CHUNKS[ci];const vis=c.words.filter(wd=>t>=wd.t-.001);
 const tW=tw(vis.map(x=>x.w).join(' '),FONTP);const w=Math.max(g('pw',t),tW+2*PAD);
 pill.style.width=w+'px';pill.style.left=(540-w/2)+'px';pill.style.top=(960-49)+'px';
 pill.style.opacity=cl(pp*1.8);pill.style.transform=`scale(${lerp(.9,1,Math.min(pp,1.03))})`;
 let x=(w-tW)/2,out='';
 c.words.forEach((wd,k)=>{const wi=tw(wd.w+(k<c.words.length-1?' ':''),FONTP);
  if(t>=wd.t){const e=1-Math.pow(1-cl((t-wd.t)/.22),3);out+=`<span class="w" style="left:${x}px;opacity:${e};transform:translateY(${(1-e)*12}px)">${wd.w}</span>`}
  x+=wi});
 pill.innerHTML=out}
if(LAYER==='pill'){window.render=renderPill;return}

/* ---------- cena do topo ---------- */
const defs=mk(svg,'defs',{});
const f1=mk(defs,'filter',{id:'sh',x:'-40%',y:'-40%',width:'180%',height:'190%'});mk(f1,'feDropShadow',{dx:0,dy:16,stdDeviation:18,'flood-color':'#000','flood-opacity':.15});
const f2=mk(defs,'filter',{id:'sh2',x:'-40%',y:'-40%',width:'180%',height:'190%'});mk(f2,'feDropShadow',{dx:0,dy:8,stdDeviation:9,'flood-color':'#000','flood-opacity':.14});
const L0=grp(svg),L1=grp(svg);

/* ícones */
function person(par,col){const gg=grp(par);mk(gg,'circle',{cx:0,cy:-26,r:30,fill:col});mk(gg,'path',{d:'M-52 52c0-40 22-60 52-60s52 20 52 60z',fill:col});return gg}
function avatar(par,o){const gg=grp(par);const bg=mk(gg,'circle',{r:104,fill:'#fff',filter:'url(#sh)'});const ring=mk(gg,'circle',{r:104,fill:'none',stroke:o.ring||'#D1D1D6','stroke-width':o.rw||6});
 const clip=mk(defs,'clipPath',{id:'ac'+o.id});mk(clip,'circle',{r:100});const pp=grp(gg);pp.setAttribute('clip-path',`url(#ac${o.id})`);const body=person(pp,o.p||GR);body.setAttribute('transform','translate(0 18)');return {gg,ring,body,bg}}
function storeI(par){const gg=grp(par);mk(gg,'rect',{x:-118,y:-30,width:236,height:136,rx:18,fill:'#fff',stroke:'#DADADF','stroke-width':4,filter:'url(#sh)'});
 const aw=grp(gg);for(let i=0;i<5;i++){mk(aw,'path',{d:`M${-128+i*51.2} -30 h51.2 v26 a25.6 25.6 0 0 1 -51.2 0z`,fill:i%2?'#fff':OR,stroke:i%2?'#DADADF':'none','stroke-width':3})}
 mk(gg,'path',{d:'M-128 -30 L-108 -86 H108 L128 -30 Z',fill:DK});
 mk(gg,'rect',{x:-26,y:28,width:52,height:78,rx:8,fill:DK});mk(gg,'rect',{x:-96,y:30,width:52,height:42,rx:8,fill:'#E9E9EE'});mk(gg,'rect',{x:44,y:30,width:52,height:42,rx:8,fill:'#E9E9EE'});return gg}
function bubble(par){const gg=grp(par);mk(gg,'path',{d:'M-62 -40 h124 a26 26 0 0 1 26 26 v36 a26 26 0 0 1 -26 26 h-96 l-30 22 v-22 a26 26 0 0 1 -24 -26 v-36 a26 26 0 0 1 26 -26z',fill:'#fff',stroke:'#D1D1D6','stroke-width':3,filter:'url(#sh2)'});
 [-36,-8,20].forEach((x,i)=>mk(gg,'rect',{x:x-6,y:-14,width:i==2?34:22,height:12,rx:6,fill:'#D9D9DE'}));mk(gg,'rect',{x:-42,y:6,width:56,height:12,rx:6,fill:'#D9D9DE'});return gg}
function dblck(par){const gg=grp(par);const a=mk(gg,'path',{d:'M-34 2 L-20 16 L8 -14',fill:'none','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'});const b=mk(gg,'path',{d:'M-6 10 L0 16 L28 -14',fill:'none','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'});return {gg,a,b}}
function coin(par){const gg=grp(par);mk(gg,'circle',{r:46,fill:OR,filter:'url(#sh2)'});mk(gg,'circle',{r:36,fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':4});TXT(gg,'R$',0,11,30,700,'#fff');return gg}
function tile(par,n){const gg=grp(par);const r=mk(gg,'rect',{x:-70,y:-70,width:140,height:140,rx:32,fill:'#fff',filter:'url(#sh)'});const tx=TXT(gg,String(n),0,26,76,700,DK);return {gg,r,tx}}
function chk(par,r){const b=grp(par);mk(b,'circle',{r,fill:GRN,stroke:'#fff','stroke-width':6});mk(b,'path',{d:`M${-r*.45} ${r*.03} L${-r*.14} ${r*.36} L${r*.5} ${-r*.34}`,fill:'none',stroke:'#fff','stroke-width':r*.24,'stroke-linecap':'round','stroke-linejoin':'round'});return b}
function tagP(par,txt){const gg=grp(par);const w=Math.ceil(tw(txt,'600 40px P'))+64;mk(gg,'rect',{x:-w/2,y:-36,width:w,height:72,rx:36,fill:'#fff',stroke:'#B8B8BD','stroke-width':3,'stroke-dasharray':'10 8'});TXT(gg,txt,0,14,40,600,'#6E6E73');return gg}
let TT=0;const pop=(e,x,y,s,o,r)=>{y+=5*Math.sin(TT*1.7+x*.013);e.setAttribute('transform',`translate(${x} ${y}) rotate(${r||0}) scale(${Math.max(s,.001)})`);e.setAttribute('opacity',cl(o))};

/* ===== S1–S4: WhatsApp → cliente, visualiza, some, sem perfil, conversa parada, custo ===== */
const line=mk(L0,'path',{d:'M370 540 H720',fill:'none',stroke:LG,'stroke-width':8,'stroke-linecap':'round','stroke-dasharray':'2 22'});
const prog=mk(L0,'path',{d:'M370 540 H720',fill:'none',stroke:OR,'stroke-width':10,'stroke-linecap':'round'});
const WA=grp(L0);mk(WA,'image',{href:'assets/wa.png',x:-110,y:-111,width:220,height:222});WA.style.filter='drop-shadow(0 16px 20px rgba(0,0,0,.18))';
const ST=storeI(L0);
const CL=avatar(L0,{id:1,ring:OR,rw:7,p:OR});
const GH=grp(L0);mk(GH,'circle',{r:104,fill:'rgba(255,255,255,.5)',stroke:'#B8B8BD','stroke-width':5,'stroke-dasharray':'14 12'});const ghp=person(GH,'#D1D1D6');ghp.setAttribute('transform','translate(0 18)');
const BB=bubble(L0);const BCK=chk(L0,26);
const DC=dblck(L0);
const TAG=tagP(L0,'sem perfil');
const OK=chk(L0,34);
const STOP=grp(L0);mk(STOP,'rect',{x:-58,y:-36,width:116,height:72,rx:36,fill:'#fff',stroke:'#D1D1D6','stroke-width':3,filter:'url(#sh2)'});[-26,0,26].forEach(x=>mk(STOP,'circle',{cx:x,cy:0,r:9,fill:'#B8B8BD'}));
const COINS=[0,1,2].map(()=>coin(L0));

P('wa',0,[[0.0,1,.4,.72],[5.0,0,.3,1]]);P('wax',0,[[0.75,1,.45,.85]]);
P('cl',0,[[0.82,1,.4,.72],[4.4,0,.32,1],[9.9,1,.4,.72],[15.45,0,.3,1]]);
P('ln',0,[[0.9,1,.5,1],[5.0,0,.3,1],[11.2,1,.4,1],[15.45,0,.3,1]]);
P('bb',0,[[0.32,1,.38,.75],[2.95,0,.25,1]]);P('bbx',0,[[0.36,1,1.0,1]]);P('bck',0,[[1.48,1,.35,.6],[2.95,0,.25,1]]);
P('dc',0,[[2.98,1,.35,.7],[4.55,0,.3,1]]);P('blue',0,[[3.05,1,.3,1]]);
P('gh',0,[[4.46,1,.45,.9],[9.75,0,.3,1]]);P('arc',0,[[7.6,1,1.6,1]]);P('ghx',0,[[5.3,1,.5,.9]]);
P('tag',0,[[6.12,1,.36,.65],[9.75,0,.3,1]]);
P('st',0,[[6.9,1,.4,.72],[15.45,0,.3,1]]);
P('ok',0,[[10.25,1,.35,.62],[11.15,0,.3,1]]);
P('pg',0,[[11.45,.48,.9,1],[15.45,0,.3,1]]);P('stop',0,[[12.3,1,.35,.65],[13.0,0,.3,1]]);
[13.46,13.66,13.86].forEach((t,i)=>P('cn'+i,0,[[t,1,.34,.62],[15.45,0,.3,1]]));
P('go',0,[[14.36,1,.7,.9]]);

/* ===== S5–S6: três passos → loja; o terceiro é o mais difícil ===== */
const ST2=storeI(L1);const TL=[1,2,3].map(n=>tile(L1,n));const CL2=avatar(L1,{id:2,ring:OR,rw:7,p:OR});
const PATH=mk(L1,'path',{d:'M150 520 H880',fill:'none',stroke:LG,'stroke-width':8,'stroke-linecap':'round','stroke-dasharray':'2 22'});L1.insertBefore(PATH,ST2);L1.insertBefore(CL2.gg,ST2);
const Q=grp(L1);mk(Q,'path',{d:'M-90 -62 h180 a34 34 0 0 1 34 34 v62 a34 34 0 0 1 -34 34 h-120 l-40 30 v-30 h-20 a34 34 0 0 1 -34 -34 v-62 a34 34 0 0 1 34 -34z',fill:'#fff',stroke:'#D1D1D6','stroke-width':3,filter:'url(#sh)'});TXT(Q,'?',0,32,92,700,OR);
const GH2=grp(L1);mk(GH2,'circle',{r:84,fill:'rgba(255,255,255,.5)',stroke:'#B8B8BD','stroke-width':5,'stroke-dasharray':'12 10'});const g2p=person(GH2,'#D1D1D6');g2p.setAttribute('transform','translate(0 14) scale(.8)');

P('pth',0,[[16.0,1,.6,1],[19.6,0,.3,1]]);
[16.40,16.62,16.84].forEach((t,i)=>P('tl'+i,0,[[t,1,.36,.66]]));
P('st2',0,[[15.95,1,.4,.72],[19.6,0,.3,1]]);P('cl2',0,[[17.5,1,.38,.72],[19.6,0,.3,1]]);
P('walk',0,[[17.82,1,1.1,1]]);P('ent',0,[[18.8,1,.35,1]]);P('glow',0,[[18.85,1,.35,.6],[19.6,0,.3,1]]);
P('foc',0,[[19.6,1,.5,.85]]);P('hard',0,[[20.55,1,.3,.35]]);
P('q',0,[[22.0,1,.38,.66]]);P('gh2',0,[[23.0,1,.4,.8]]);P('gone',0,[[23.4,1,.5,1]]);

window.render=function(t){TT=t;
 /* ---- S1-S4 ---- */
 const wa=g('wa',t),wax=cl(g('wax',t),0,1.03);
 pop(WA,lerp(540,225,wax),lerp(500,540,wax),lerp(.5,1,Math.min(wa,1.06))*lerp(1.5,1.18,wax),wa*1.6);
 const st=g('st',t);pop(ST,250,560,lerp(.5,1.15,Math.min(st,1.06)),st*1.6);
 const lnA=cl(g('ln',t));line.setAttribute('opacity',lnA);
 const pg=cl(g('pg',t));prog.setAttribute('opacity',pg>.01?lnA:0);prog.style.strokeDasharray=350;prog.style.strokeDashoffset=350*(1-pg);
 const clv=g('cl',t);CL.gg.setAttribute('transform',`translate(850 540) scale(${lerp(.5,1.3,Math.min(clv,1.06))})`);CL.gg.setAttribute('opacity',cl(clv*1.6));
 const bx=cl(g('bbx',t),0,1.05),bbv=g('bb',t);pop(BB,lerp(330,600,bx),lerp(380,370,bx),lerp(.5,1.3,Math.min(bbv,1.06)),bbv*1.6);
 const bc=g('bck',t);pop(BCK,lerp(330,600,bx)+104,lerp(380,370,bx)-50,lerp(.3,1.3,Math.min(bc,1.1)),bc*1.8);
 const dcv=g('dc',t),bl=cl(g('blue',t));pop(DC.gg,850,330,lerp(.4,1.8,Math.min(dcv,1.08)),dcv*1.6);
 const col=`rgb(${Math.round(lerp(142,52,bl))},${Math.round(lerp(142,183,bl))},${Math.round(lerp(147,241,bl))})`;DC.a.setAttribute('stroke',col);DC.b.setAttribute('stroke',col);
 const ghv=g('gh',t),ghx=cl(g('ghx',t),0,1.03);const ar=cl(g('arc',t));pop(GH,lerp(lerp(850,800,ghx),560,ar),lerp(520,470,ar),lerp(1.1,1.25,Math.min(ghv,1.04))*lerp(1,.55,ar),ghv*1.4*lerp(1,.5,ar));
 const tg=g('tag',t);pop(TAG,lerp(lerp(850,800,ghx),560,ar),lerp(720,600,ar),lerp(.4,1.25,Math.min(tg,1.08))*lerp(1,.7,ar),tg*1.6*lerp(1,.5,ar),(1-cl(tg))*-8);
 const ok=g('ok',t);pop(OK,850+96,540-96,lerp(.3,1.3,Math.min(ok,1.1)),ok*1.8);
 const sp=g('stop',t);pop(STOP,370+350*.48,450,lerp(.4,1.3,Math.min(sp,1.08)),sp*1.6);
 const go=cl(g('go',t),0,1.02);
 COINS.forEach((c,i)=>{const v=g('cn'+i,t);const x0=850+(i-1)*88,y0=330;pop(c,lerp(x0,240+(i-1)*70,go),lerp(y0,400,go),lerp(.3,1.15,Math.min(v,1.08)),v*1.7)});
 /* ---- S5-S6 ---- */
 const foc=cl(g('foc',t),0,1.03),hard=g('hard',t);
 const pth=cl(g('pth',t));PATH.setAttribute('opacity',pth);dash(PATH,pth);
 const st2=g('st2',t),glow=g('glow',t);pop(ST2,875,500,lerp(.5,.84,Math.min(st2,1.06))+.06*Math.max(0,Math.sin(Math.PI*cl(glow))),st2*1.6);
 const TX=[270,445,620];
 TL.forEach((o,i)=>{const v=g('tl'+i,t);let x=TX[i],y=520,s=lerp(.4,1.0,Math.min(v,1.08)),op=cl(v*1.6);
  if(i<2){op*=lerp(1,.3,foc);s*=lerp(1,.8,foc);x=lerp(x,i==0?190:330,foc);y=lerp(y,620,foc)}
  else{x=lerp(x,580,foc);y=lerp(y,560,foc);s*=lerp(1,1.5,foc);if(t>20.5)s*=1+.22*(hard-1)*Math.exp(-(t-20.5)*1.5);
   o.r.setAttribute('fill',foc>.5?OR:'#fff');o.tx.setAttribute('fill',foc>.5?'#fff':DK)}
  pop(o.gg,x,y,s,op)});
 const wk=cl(g('walk',t),0,1);const cl2=g('cl2',t);
 const ent=cl(g('ent',t));CL2.gg.setAttribute('transform',`translate(${lerp(150,875,wk)} ${520-Math.abs(Math.sin(wk*Math.PI*3))*150+ent*30}) scale(${.6*lerp(.5,1,Math.min(cl2,1.06))*lerp(1,.3,ent)})`);CL2.gg.setAttribute('opacity',cl(cl2*1.6)*(1-ent));
 /* "o mais difícil": anel que pulsa no 3 */
 const qv=g('q',t);pop(Q,580,lerp(320,330,cl(qv)),lerp(.4,1,Math.min(qv,1.08)),qv*1.6);
 const g2=g('gh2',t),gone=cl(g('gone',t));pop(GH2,860,560,lerp(.7,1.2,Math.min(g2,1.05))*lerp(1,.85,gone),cl(g2*1.6)*lerp(1,.25,gone));
};
}
document.fonts.load('600 64px P').then(()=>document.fonts.load('700 40px P')).then(()=>document.fonts.ready).then(()=>{try{init();window.render(0);window.READY=1}catch(e){console.error(e)}});
</script>
